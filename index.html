<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Ref Sheet Commission Calculator</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet" />

<script>
const CONFIG = {

  IMAGE_BASE_URL: "https://limie-arts.github.io/commission-widget/",
  BASE_IMG: "base.png",

  CREATOR_NAME: "Limie.Arts",
  CREATOR_URL: "https://limie.gumroad.com", 

  /* ============================================================
   ✏️  ARTIST CONFIGURATION — Edit only this section!
   How to change prices? Simply overwrite the number after "price: "
   ============================================================ */

  BASE_PRICE: 60,      // Base price
  CURRENCY: "EUR",     // currency

  CATEGORIES: [
    {
      label: "Fullbodies",
      items: [
        { id: "back_view",     label: "Back view",         price: 55,  img: "back.png" },
        { id: "clothes_ver",   label: "Clothes version",   price: 50,  img: "clothes.png" },
        { id: "gender_switch", label: "Gender switch",     price: 60,  img: "gender_switch.png" },
      ]
    },
    {
      label: "Close-ups",
      items: [
        { id: "mouth",         label: "Mouth",             price: 10,  img: "mouth.png" },
        { id: "eyes",          label: "Eyes",              price: 10,  img: "eyes.png" },
        { id: "other_closeup", label: "Other",             price: 20,  img: null }, 
      ]
    },
    {
      label: "Extras",
      items: [
        { id: "bust",          label: "Bust",              price: 45,  img: "bust.png" },
        { id: "expression",    label: "Expression",        price: 30,  img: "expression.png" },
        { id: "expr_bundle",   label: "Expressions bundle (4 expr.)", price: 100, img: "bundle_expre.png" },
        { id: "things_oc",     label: "Things OC likes",   price: 15,  img: "things.png" },
      ]
    }
  ]
};
</script>

<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root {
  --bg:            #F4F0FB;
  --surface:       #FFFFFF;
  --surface-2:     #F9F7FF;
  --border:        #E2D9F7;
  --accent:        #7C5CBF;
  --accent-light:  #C9B8FF;
  --accent-glow:   rgba(124, 92, 191, 0.13);
  --accent-sel:    rgba(124, 92, 191, 0.10);
  --rose:          #FF8FB1;
  --text-strong:   #2D2040;
  --text:          #4A3E6A;
  --text-muted:    #8C7EAA;
  --radius-lg:     20px;
  --radius-md:     12px;
  --shadow-card:   0 4px 24px rgba(44,32,80,0.09), 0 1px 4px rgba(44,32,80,0.05);
  --font-ui:       'DM Sans', system-ui, sans-serif;
  --font-display:  'Playfair Display', Georgia, serif;
  --bar-h: 72px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  font-family: var(--font-ui);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 24px 14px calc(var(--bar-h) + 24px + env(safe-area-inset-bottom, 0px));
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

.widget { max-width: 1040px; margin: 0 auto; }

.widget-header {
  text-align: center;
  margin-bottom: 20px;
}
.widget-header h1 {
  font-family: var(--font-display);
  font-size: clamp(1.45rem, 5vw, 2.4rem);
  color: var(--text-strong);
  font-weight: 600;
  letter-spacing: -0.01em;
}
.widget-header p {
  margin-top: 5px;
  font-size: 0.88rem;
  color: var(--text-muted);
  font-weight: 300;
}

.layout {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
  align-items: start;
}

@media (min-width: 720px) {
  body { padding-bottom: 48px; }
  .layout {
    grid-template-columns: 1fr 1fr;
    gap: 24px;
  }
}

/* ============================================================
   PREVIEW PANEL
   ============================================================ */
.preview-panel {
  background: var(--surface);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
  overflow: hidden;
}

@media (min-width: 720px) {
  .preview-panel {
    position: sticky;
    top: 20px;
  }
}

.preview-header {
  padding: 13px 18px 11px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
}
.preview-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--accent-light);
}
.preview-header span {
  font-size: 0.75rem;
  font-weight: 500;
  color: var(--text-muted);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.preview-stack {
  position: relative;
  width: 100%;
  background: var(--surface-2);
  display: flex;
  align-items: center;
  justify-content: center;
}

.preview-base-img {
  width: 100%;
  height: auto;
  display: block;
}

.preview-layer-img {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease-in-out;
}
.preview-layer-img.visible { opacity: 1; }

.layer-count {
  position: absolute;
  bottom: 10px; right: 10px;
  background: rgba(255,255,255,0.9);
  color: var(--accent);
  font-size: 0.62rem;
  font-weight: 600;
  padding: 3px 9px;
  border-radius: 99px;
  border: 1px solid var(--border);
  backdrop-filter: blur(4px);
  display: none;
}
.layer-count.show { display: block; }

/* ============================================================
   CONTROLS PANEL
   ============================================================ */
.controls-panel {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.category-card {
  background: var(--surface);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
  overflow: hidden;
}

.category-title {
  padding: 13px 18px 11px;
  font-family: var(--font-display);
  font-size: 1rem;
  font-weight: 500;
  color: var(--text-strong);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
}
.category-title::before {
  content: "";
  width: 3px; height: 1em;
  background: linear-gradient(to bottom, var(--accent), var(--rose));
  border-radius: 2px;
}

.category-items {
  padding: 10px 12px 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.item-checkbox {
  position: absolute;
  opacity: 0;
  width: 0; height: 0;
  pointer-events: none;
}

.item-row {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 52px;
  padding: 10px 14px;
  border-radius: var(--radius-md);
  border: 2px solid var(--border);
  background: var(--surface-2);
  cursor: pointer;
  user-select: none;
  transition: border-color 0.18s, background 0.18s;
  -webkit-tap-highlight-color: transparent;
}

@media (hover: hover) {
  .item-row:hover {
    border-color: var(--accent-light);
    background: var(--accent-sel);
  }
}

.item-row.selected {
  border-color: var(--accent);
  background: var(--accent-glow);
  box-shadow: 0 0 0 1px var(--accent);
}

.item-tick {
  width: 22px; height: 22px;
  flex-shrink: 0;
  border-radius: 6px;
  border: 2px solid var(--accent-light);
  background: var(--surface);
  position: relative;
  transition: background 0.15s, border-color 0.15s;
}
.item-row.selected .item-tick {
  background: var(--accent);
  border-color: var(--accent);
}
.item-row.selected .item-tick::after {
  content: "";
  position: absolute;
  top: 3px; left: 6px;
  width: 6px; height: 10px;
  border: 2px solid #fff;
  border-top: none;
  border-left: none;
  transform: rotate(45deg);
}

.item-label {
  flex: 1;
  font-size: 0.9rem;
  color: var(--text);
  font-weight: 400;
}
.item-row.selected .item-label {
  color: var(--text-strong);
  font-weight: 500;
}

.item-price {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--accent);
  white-space: nowrap;
}

/* ============================================================
   TOTALS & CARDS
   ============================================================ */
.total-card-desktop { display: none; }

@media (min-width: 720px) {
  .total-card-desktop {
    display: block;
    background: linear-gradient(135deg, var(--accent) 0%, #a07ae0 100%);
    border-radius: var(--radius-lg);
    padding: 22px 24px 20px;
    color: #fff;
    box-shadow: 0 6px 28px rgba(124,92,191,0.38);
    position: relative;
    overflow: hidden;
  }
}

.sticky-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 100;
  background: linear-gradient(135deg, var(--accent) 0%, #a07ae0 100%);
  box-shadow: 0 -4px 24px rgba(44,32,80,0.22);
  padding: 12px 20px;
  padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  color: #fff;
}

@media (min-width: 720px) {
  .sticky-bar { display: none; }
}

.sticky-label {
  font-size: 0.72rem;
  font-weight: 500;
  opacity: 0.78;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.sticky-amount {
  font-family: var(--font-display);
  font-size: 1.7rem;
  font-weight: 600;
  text-align: right;
}
.sticky-breakdown {
  display: none;
  font-size: 0.7rem;
  opacity: 0.78;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 45vw;
}

.total-label-inner {
  font-size: 0.72rem;
  font-weight: 500;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  opacity: 0.78;
  margin-bottom: 4px;
}
.total-amount-inner {
  font-family: var(--font-display);
  font-size: clamp(2rem, 5vw, 2.6rem);
  font-weight: 600;
  line-height: 1;
}
.total-breakdown-inner {
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid rgba(255,255,255,0.22);
  font-size: 0.76rem;
  opacity: 0.82;
}

.btn-reset {
  width: 100%;
  padding: 13px 0;
  border: 2px solid var(--border);
  background: var(--surface);
  color: var(--text-muted);
  border-radius: var(--radius-md);
  font-family: var(--font-ui);
  font-size: 0.88rem;
  font-weight: 500;
  cursor: pointer;
  min-height: 48px;
}
.btn-reset:hover {
  border-color: var(--accent-light);
  color: var(--accent);
}

.disclaimer {
  font-size: 0.74rem;
  color: var(--text-muted);
  font-weight: 300;
  font-style: italic;
  line-height: 1.5;
  text-align: center;
  padding: 2px 4px 0;
}

.creator-credit {
  font-size: 0.68rem;
  color: var(--text-muted);
  opacity: 0.65;
  text-align: center;
  padding-top: 6px;
  font-weight: 300;
}
.creator-credit a {
  color: inherit;
  text-decoration: underline;
  text-underline-offset: 2px;
}
.creator-credit a:hover {
  color: var(--accent);
}
</style>
</head>
<body>

<div class="sticky-bar" id="stickyBar">
  <div>
    <div class="sticky-label">Estimated Total</div>
    <div class="sticky-breakdown" id="stickyBreakdown"></div>
  </div>
  <div class="sticky-amount" id="stickyAmount"></div>
</div>

<div class="widget">
  <div class="widget-header">
    <h1>Reference Sheet Calculator</h1>
    <p>Tap the add-ons you want — the price updates instantly.</p>
  </div>

  <div class="layout">
    <div class="preview-panel" id="previewPanel">
      <div class="preview-header">
        <div class="preview-dot"></div>
        <span>Live Preview</span>
      </div>
      <div class="preview-stack" id="previewStack">
        <!-- Generováno skriptem -->
        <span class="layer-count" id="layerCount"></span>
      </div>
    </div>

    <div class="controls-panel" id="controlsPanel"></div>
  </div>
</div>

<script>
(function () {
  "use strict";

  function formatPrice(amount) {
    return amount + "\u202f" + CONFIG.CURRENCY;
  }

  const stack = document.getElementById("previewStack");
  const layerCountEl = document.getElementById("layerCount");

  // 1. Vložení Base obrázku
  const baseImg = document.createElement("img");
  baseImg.className = "preview-base-img";
  baseImg.src = CONFIG.IMAGE_BASE_URL + CONFIG.BASE_IMG;
  baseImg.alt = "Base reference";
  stack.appendChild(baseImg);

  // 2. Příprava PNG vrstev
  CONFIG.CATEGORIES.forEach(cat => {
    cat.items.forEach(item => {
      if (item.img) {
        const layerImg = document.createElement("img");
        layerImg.className = "preview-layer-img";
        layerImg.id = "layer-" + item.id;
        layerImg.src = CONFIG.IMAGE_BASE_URL + item.img;
        layerImg.alt = item.label;
        stack.appendChild(layerImg);
      }
    });
  });

  // 3. Generování tlačítek možností
  const controlsPanel = document.getElementById("controlsPanel");
  const allRows = [];

  CONFIG.CATEGORIES.forEach(cat => {
    const card = document.createElement("div");
    card.className = "category-card";

    const title = document.createElement("div");
    title.className = "category-title";
    title.textContent = cat.label;
    card.appendChild(title);

    const itemsDiv = document.createElement("div");
    itemsDiv.className = "category-items";

    cat.items.forEach(item => {
      const row = document.createElement("label");
      row.className = "item-row";
      row.htmlFor   = "cb-" + item.id;

      const cb = document.createElement("input");
      cb.type          = "checkbox";
      cb.id            = "cb-" + item.id;
      cb.className     = "item-checkbox";
      cb.dataset.price = item.price;
      cb.dataset.layer = item.id;

      const tick = document.createElement("span");
      tick.className = "item-tick";

      const lbl = document.createElement("span");
      lbl.className = "item-label";
      lbl.textContent = item.label;

      const price = document.createElement("span");
      price.className = "item-price";
      price.textContent = "+" + formatPrice(item.price);

      row.appendChild(cb);
      row.appendChild(tick);
      row.appendChild(lbl);
      row.appendChild(price);
      itemsDiv.appendChild(row);

      cb.addEventListener("change", () => onToggle(row, cb, item));
      allRows.push({ row, cb, item });
    });

    card.appendChild(itemsDiv);
    controlsPanel.appendChild(card);
  });

  // 4. Desktop panel a spodní texty
  const totalCardDesktop = document.createElement("div");
  totalCardDesktop.className = "total-card-desktop";
  totalCardDesktop.innerHTML = `
    <div class="total-label-inner">Estimated Total</div>
    <div class="total-amount-inner" id="totalAmountDesktop">${formatPrice(CONFIG.BASE_PRICE)}</div>
    <div class="total-breakdown-inner" id="totalBreakdownDesktop">No add-ons selected yet.</div>
  `;

  const resetBtn = document.createElement("button");
  resetBtn.className   = "btn-reset";
  resetBtn.textContent = "Clear all selections";
  resetBtn.addEventListener("click", resetAll);

  const disclaimer = document.createElement("p");
  disclaimer.className = "disclaimer";
  disclaimer.textContent =
    "This is an estimated price only. If you have specific requests for the reference sheet that are not listed here, please mention them in your message!";

  const credit = document.createElement("p");
  credit.className = "creator-credit";
  credit.innerHTML = `Calculator <a href="${CONFIG.CREATOR_URL}" target="_blank" rel="noopener">widget</a> by ${CONFIG.CREATOR_NAME}`;

  controlsPanel.appendChild(totalCardDesktop);
  controlsPanel.appendChild(resetBtn);
  controlsPanel.appendChild(disclaimer);
  controlsPanel.appendChild(credit);

  document.getElementById("stickyAmount").textContent = formatPrice(CONFIG.BASE_PRICE);

  // 5. Obsluha kliknutí
  function onToggle(row, cb, item) {
    row.classList.toggle("selected", cb.checked);

    if (item.img) {
      const layerEl = document.getElementById("layer-" + cb.dataset.layer);
      if (layerEl) layerEl.classList.toggle("visible", cb.checked);
    }

    recalculate();
  }

  // 6. Přepočet ceny
  function recalculate() {
    let total = CONFIG.BASE_PRICE;
    const breakdown = [];

    allRows.forEach(({ cb, item }) => {
      if (cb.checked) {
        total += parseInt(cb.dataset.price, 10);
        breakdown.push(item.label);
      }
    });

    const activeLayers = allRows.filter(r => r.cb.checked && r.item.img).length;
    layerCountEl.textContent = activeLayers + (activeLayers === 1 ? " layer" : " layers");
    layerCountEl.classList.toggle("show", activeLayers > 0);

    const priceStr = formatPrice(total);

    const amtD = document.getElementById("totalAmountDesktop");
    if (amtD) amtD.textContent = priceStr;

    const brkD = document.getElementById("totalBreakdownDesktop");
    if (brkD) {
      const parts = CONFIG.BASE_PRICE > 0
        ? ["Base " + formatPrice(CONFIG.BASE_PRICE), ...breakdown]
        : breakdown;
      brkD.textContent = parts.length ? parts.join(" · ") : "No add-ons selected yet.";
    }

    const stickyAmt = document.getElementById("stickyAmount");
    stickyAmt.textContent = priceStr;

    const stickyBrk = document.getElementById("stickyBreakdown");
    if (breakdown.length) {
      stickyBrk.textContent = breakdown.join(" · ");
      stickyBrk.style.display = "block";
    } else {
      stickyBrk.style.display = "none";
    }
  }

  // 7. Reset
  function resetAll() {
    allRows.forEach(({ row, cb, item }) => {
      cb.checked = false;
      row.classList.remove("selected");
      if (item.img) {
        const layerEl = document.getElementById("layer-" + cb.dataset.layer);
        if (layerEl) layerEl.classList.remove("visible");
      }
    });
    recalculate();
  }

})();
</script>
</body>
</html>
