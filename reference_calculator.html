<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Ref Sheet Commission Calculator</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet" />

<script>
/* ============================================================
   ✏️  ARTIST CONFIGURATION — Edit only this section!
   ============================================================
   Change item names, prices, and descriptions freely here.
   The entire UI and all price calculations are generated
   automatically from this object — you never need to touch
   the HTML or the rest of the JS.

   BASE_PRICE: the starting price before any add-ons.
               Set to 0 if your base is sold separately.
   CURRENCY:   the currency label shown in the UI.
   ============================================================ */
const CONFIG = {

  BASE_PRICE: 60,      // Starting price before any add-ons
  CURRENCY: "EUR",     // Currency label

  /*
     ✏️  BASE IMAGE
     Path to your base reference sheet image.
     Put the file in the same folder as this HTML file and set the filename here.
  */
  BASE_IMG: "base.png",

  /* --- Categories & line items ---
     Each category has:
       label  — displayed section heading
       items  — array of add-on options, each with:
                  id    — unique key (used internally, no spaces)
                  label — button label shown to the user
                  price — price added when selected
                  img   — filename of the overlay PNG (null = no visual change)
                          Put all PNGs in the same folder as this HTML file.
  */
  CATEGORIES: [
    {
      label: "Fullbodies",
      items: [
        { id: "back_view",     label: "Back view",                    price: 55,  img: "back.png"          },
        { id: "clothes_ver",   label: "Clothes version",              price: 50,  img: "clothes.png"       },
        { id: "gender_switch", label: "Gender switch",                price: 60,  img: "gender_switch.png" },
      ]
    },
    {
      label: "Close-ups",
      items: [
        { id: "mouth",         label: "Mouth",                        price: 10,  img: "mouth.png"         },
        { id: "eyes",          label: "Eyes",                         price: 10,  img: "eyes.png"          },
        { id: "other_closeup", label: "Other",                        price: 20,  img: null                },
      ]
    },
    {
      label: "Extras",
      items: [
        { id: "bust",          label: "Bust",                         price: 45,  img: "bust.png"          },
        { id: "expression",    label: "Expression",                   price: 25,  img: "expression.png"    },
        { id: "expr_bundle",   label: "Expressions bundle (4 expr.)", price: 100, img: "bundle_expr.png"   },
        { id: "things_oc",     label: "Things OC likes",              price: 15,  img: "things.png"        },
      ]
    }
  ]
};
</script>

<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root {
  --bg:            #F4F0FB;
  --surface:       #FFFFFF;
  --surface-2:     #F9F7FF;
  --border:        #E2D9F7;
  --accent:        #7C5CBF;
  --accent-light:  #C9B8FF;
  --accent-glow:   rgba(124, 92, 191, 0.13);
  --accent-sel:    rgba(124, 92, 191, 0.10);
  --rose:          #FF8FB1;
  --text-strong:   #2D2040;
  --text:          #4A3E6A;
  --text-muted:    #8C7EAA;
  --radius-lg:     20px;
  --radius-md:     12px;
  --radius-sm:     8px;
  --shadow-card:   0 4px 24px rgba(44,32,80,0.09), 0 1px 4px rgba(44,32,80,0.05);
  --shadow-hover:  0 8px 32px rgba(44,32,80,0.14), 0 2px 8px rgba(44,32,80,0.07);
  --font-ui:       'DM Sans', system-ui, sans-serif;
  --font-display:  'Playfair Display', Georgia, serif;

  /* Sticky bar height — used for body bottom padding */
  --bar-h: 72px;
}

/* ============================================================
   RESET & BASE  (mobile-first — no media queries needed for basics)
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: var(--font-ui);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  /* Leave room at the bottom for the sticky price bar */
  padding: 24px 14px calc(var(--bar-h) + 24px + env(safe-area-inset-bottom, 0px));
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

/* ============================================================
   WIDGET WRAPPER
   ============================================================ */
.widget { max-width: 1040px; margin: 0 auto; }

/* ---- Header ---- */
.widget-header {
  text-align: center;
  margin-bottom: 20px;
}
.widget-header h1 {
  font-family: var(--font-display);
  font-size: clamp(1.45rem, 5vw, 2.4rem);
  color: var(--text-strong);
  font-weight: 600;
  letter-spacing: -0.01em;
}
.widget-header p {
  margin-top: 5px;
  font-size: 0.88rem;
  color: var(--text-muted);
  font-weight: 300;
}

/* ============================================================
   LAYOUT
   Mobile:  single column — preview on top, controls below
   Desktop: two columns — preview sticky on left, controls scroll right
   ============================================================ */
.layout {
  display: grid;
  grid-template-columns: 1fr;   /* mobile: one column */
  gap: 16px;
  align-items: start;
}

@media (min-width: 720px) {
  body {
    /* On desktop the sticky bar is hidden, restore normal padding */
    padding-bottom: 48px;
  }
  .layout {
    grid-template-columns: 1fr 1fr;
    gap: 24px;
  }
}

/* ============================================================
   LEFT PANEL — PREVIEW
   ============================================================ */
.preview-panel {
  background: var(--surface);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
  overflow: hidden;
  /* Sticky only on desktop */
}

@media (min-width: 720px) {
  .preview-panel {
    position: sticky;
    top: 20px;
  }
}


.preview-header {
  padding: 13px 18px 11px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
}
.preview-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--accent-light);
  flex-shrink: 0;
}
.preview-header span {
  font-size: 0.75rem;
  font-weight: 500;
  color: var(--text-muted);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

/* The stacking canvas.
   The base <img> defines the natural height — no fixed aspect-ratio needed.
   All overlay <img> tags are position:absolute so they float on top
   without adding to document flow. */
.preview-stack {
  position: relative;
  width: 100%;
  background: var(--surface-2);
  overflow: hidden;
  line-height: 0;  /* collapse inline-block gap below the base img */
}

/* BASE image — static, defines the canvas size */
.layer-base-img {
  display: block;
  width: 100%;
  height: auto;    /* natural height from the image — overlays match this */
}

/* On mobile, cap the preview so it doesn't take over the whole screen */
@media (max-width: 719px) {
  .layer-base-img { max-height: 72vw; object-fit: contain; width: 100%; }
}

/* Overlay PNG layers — absolutely stacked, fade in/out */
.preview-layer {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  opacity: 0;
  transition: opacity 0.3s cubic-bezier(0.4,0,0.2,1);
  pointer-events: none;
  object-fit: contain;   /* must match .layer-base-img to align perfectly */
  display: block;
}
.preview-layer.visible { opacity: 1; }

.layer-count {
  position: absolute;
  bottom: 10px; right: 10px;
  background: rgba(255,255,255,0.9);
  color: var(--accent);
  font-size: 0.62rem;
  font-weight: 600;
  padding: 3px 9px;
  border-radius: 99px;
  border: 1px solid var(--border);
  backdrop-filter: blur(4px);
  letter-spacing: 0.03em;
  display: none;
}
.layer-count.show { display: block; }

/* ============================================================
   RIGHT PANEL — CONTROLS
   ============================================================ */
.controls-panel {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

/* ---- Category card ---- */
.category-card {
  background: var(--surface);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
  overflow: hidden;
}

.category-title {
  padding: 13px 18px 11px;
  font-family: var(--font-display);
  font-size: 1rem;
  font-weight: 500;
  color: var(--text-strong);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
}
.category-title::before {
  content: "";
  width: 3px; height: 1em;
  background: linear-gradient(to bottom, var(--accent), var(--rose));
  border-radius: 2px;
  display: block;
  flex-shrink: 0;
}

/* ---- Touch-friendly item grid ---- */
.category-items {
  padding: 10px 12px 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;               /* space between tap cards */
}

/* The hidden real checkbox — kept for state, hidden visually */
.item-checkbox {
  position: absolute;
  opacity: 0;
  width: 0; height: 0;
  pointer-events: none;
}

/*
  .item-row  —  the big tappable card
  min-height: 52px guarantees the Apple / Material 44px+ tap target guideline
*/
.item-row {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 52px;
  padding: 10px 14px;
  border-radius: var(--radius-md);
  border: 2px solid var(--border);
  background: var(--surface-2);
  cursor: pointer;
  user-select: none;
  transition: border-color 0.18s, background 0.18s, box-shadow 0.18s;
  /* Touch: kill tap highlight flash on iOS */
  -webkit-tap-highlight-color: transparent;
}

/* Hover (desktop only — no hover on touch) */
@media (hover: hover) {
  .item-row:hover {
    border-color: var(--accent-light);
    background: var(--accent-sel);
  }
}

/* SELECTED state — strong purple border + tinted background */
.item-row.selected {
  border-color: var(--accent);
  background: var(--accent-glow);
  box-shadow: 0 0 0 1px var(--accent);
}

/* Custom checkmark bubble */
.item-tick {
  width: 22px; height: 22px;
  flex-shrink: 0;
  border-radius: 6px;
  border: 2px solid var(--accent-light);
  background: var(--surface);
  position: relative;
  transition: background 0.15s, border-color 0.15s;
}
.item-row.selected .item-tick {
  background: var(--accent);
  border-color: var(--accent);
}
/* Checkmark via pseudo */
.item-row.selected .item-tick::after {
  content: "";
  position: absolute;
  top: 3px; left: 6px;
  width: 6px; height: 10px;
  border: 2px solid #fff;
  border-top: none;
  border-left: none;
  transform: rotate(45deg);
}

.item-label {
  flex: 1;
  font-size: 0.9rem;
  color: var(--text);
  font-weight: 400;
  line-height: 1.3;
  transition: color 0.15s;
}
.item-row.selected .item-label {
  color: var(--text-strong);
  font-weight: 500;
}

.item-price {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--accent);
  white-space: nowrap;
}
.item-row.selected .item-price {
  color: var(--accent);
}

/* ============================================================
   DESKTOP-ONLY: inline total card (inside controls panel)
   Hidden on mobile — replaced by sticky bar.
   ============================================================ */
.total-card-desktop {
  display: none;
}

@media (min-width: 720px) {
  .total-card-desktop {
    display: block;
    background: linear-gradient(135deg, var(--accent) 0%, #a07ae0 100%);
    border-radius: var(--radius-lg);
    padding: 22px 24px 20px;
    color: #fff;
    box-shadow: 0 6px 28px rgba(124,92,191,0.38);
    position: relative;
    overflow: hidden;
  }
  .total-card-desktop::before {
    content: "";
    position: absolute;
    top: -40px; right: -30px;
    width: 140px; height: 140px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
  }
}

/* ============================================================
   STICKY PRICE BAR  — mobile only, fixed to bottom of viewport
   ============================================================ */
.sticky-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 100;
  background: linear-gradient(135deg, var(--accent) 0%, #a07ae0 100%);
  box-shadow: 0 -4px 24px rgba(44,32,80,0.22);
  padding: 12px 20px;
  padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  color: #fff;
}

/* Hide sticky bar on desktop */
@media (min-width: 720px) {
  .sticky-bar { display: none; }
}

.sticky-label {
  font-size: 0.72rem;
  font-weight: 500;
  opacity: 0.78;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  white-space: nowrap;
}
.sticky-amount {
  font-family: var(--font-display);
  font-size: 1.7rem;
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1;
  flex: 1;
  text-align: right;
}
.sticky-breakdown {
  display: none; /* shown only when > 0 items selected */
  font-size: 0.7rem;
  opacity: 0.78;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 45vw;
}

/* Shared total inner elements (used inside both card and bar) */
.total-label-inner {
  font-size: 0.72rem;
  font-weight: 500;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  opacity: 0.78;
  margin-bottom: 4px;
}
.total-amount-inner {
  font-family: var(--font-display);
  font-size: clamp(2rem, 5vw, 2.6rem);
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1;
  position: relative;
  z-index: 1;
}
.total-breakdown-inner {
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid rgba(255,255,255,0.22);
  font-size: 0.76rem;
  opacity: 0.82;
  min-height: 1.2em;
  line-height: 1.6;
  position: relative;
  z-index: 1;
}

/* Reset button */
.btn-reset {
  width: 100%;
  padding: 13px 0;
  border: 2px solid var(--border);
  background: var(--surface);
  color: var(--text-muted);
  border-radius: var(--radius-md);
  font-family: var(--font-ui);
  font-size: 0.88rem;
  font-weight: 500;
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s, background 0.15s;
  letter-spacing: 0.01em;
  /* Big enough tap target */
  min-height: 48px;
  -webkit-tap-highlight-color: transparent;
}
.btn-reset:hover {
  border-color: var(--accent-light);
  color: var(--accent);
  background: var(--accent-glow);
}
.btn-reset:active { opacity: 0.75; }

/* ---- Disclaimer ---- */
.disclaimer {
  font-size: 0.74rem;
  color: var(--text-muted);
  font-weight: 300;
  font-style: italic;
  line-height: 1.5;
  text-align: center;
  padding: 2px 4px 0;
}

/* ---- Creator credit ---- */
.creator-credit {
  font-size: 0.68rem;
  color: var(--text-muted);
  opacity: 0.55;
  text-align: center;
  padding-top: 6px;
  font-weight: 300;
}
.creator-credit a {
  color: inherit;
  text-decoration: underline;
  text-decoration-color: transparent;
  text-underline-offset: 2px;
  transition: color 0.2s, text-decoration-color 0.2s, opacity 0.2s;
}
.creator-credit a:hover {
  color: var(--accent);
  text-decoration-color: var(--accent);
  opacity: 1;
}

/* ============================================================
   ANIMATION
   ============================================================ */
@media (prefers-reduced-motion: no-preference) {
  .total-amount-inner,
  .sticky-amount {
    transition: transform 0.12s ease;
  }
  .total-amount-inner.bump,
  .sticky-amount.bump {
    transform: scale(1.05);
  }
}
</style>
</head>
<body>

<!-- ============================================================
     STICKY PRICE BAR (mobile) — updated by JS
     ============================================================ -->
<div class="sticky-bar" id="stickyBar" aria-live="polite">
  <div>
    <div class="sticky-label">Estimated Total</div>
    <div class="sticky-breakdown" id="stickyBreakdown"></div>
  </div>
  <div class="sticky-amount" id="stickyAmount"></div>
</div>

<!-- ============================================================
     WIDGET ROOT
     ============================================================ -->
<div class="widget">
  <div class="widget-header">
    <h1>Reference Sheet Calculator</h1>
    <p>Tap the add-ons you want — the price updates instantly.</p>
  </div>

  <div class="layout">
    <!-- LEFT: Preview panel -->
    <div class="preview-panel" id="previewPanel">
      <div class="preview-header">
        <div class="preview-dot"></div>
        <span>Live Preview</span>
      </div>
      <div class="preview-stack" id="previewStack">
        <!-- Base image — always visible, set via CONFIG.BASE_IMG -->
        <img class="layer-base-img" id="baseImg" alt="Base reference sheet" />
        <span class="layer-count" id="layerCount"></span>
        <!-- Overlay PNG layers are injected here by JS -->
      </div>
    </div>

    <!-- RIGHT: Controls panel (built by JS) -->
    <div class="controls-panel" id="controlsPanel"></div>
  </div>
</div>

<!-- ============================================================
     APPLICATION SCRIPT
     ============================================================ -->
<script>
(function () {
  "use strict";

  /* ----------------------------------------------------------
     1. UTILITY
  ---------------------------------------------------------- */
  function formatPrice(amount) {
    // Narrow no-break space between number and currency
    return amount + "\u202f" + CONFIG.CURRENCY;
  }

  /* ----------------------------------------------------------
     2. PREVIEW — base image + PNG overlay layers
  ---------------------------------------------------------- */

  // Set the base image src from config
  document.getElementById("baseImg").src = CONFIG.BASE_IMG;

  const stack = document.getElementById("previewStack");
  const layerCountEl = document.getElementById("layerCount");

  // Create one <img> overlay per item that has an img defined.
  // Items with img: null get no overlay element (price still works).
  CONFIG.CATEGORIES.forEach(cat => {
    cat.items.forEach(item => {
      if (!item.img) return;   // no visual layer for this item

      const img = document.createElement("img");
      img.className = "preview-layer";
      img.id        = "layer-" + item.id;
      img.src       = item.img;
      img.alt       = item.label;           // accessibility
      stack.appendChild(img);
    });
  });

  /* ----------------------------------------------------------
     3. CONTROLS — build touch-card UI from config
  ---------------------------------------------------------- */
  const controlsPanel = document.getElementById("controlsPanel");
  const allRows = [];   // { row, cb, item } — track everything here

  CONFIG.CATEGORIES.forEach(cat => {
    const card = document.createElement("div");
    card.className = "category-card";

    const title = document.createElement("div");
    title.className = "category-title";
    title.textContent = cat.label;
    card.appendChild(title);

    const itemsDiv = document.createElement("div");
    itemsDiv.className = "category-items";

    cat.items.forEach(item => {
      /*
        We use a <label> as the tap target so the hidden <input>
        stays accessible and keyboard-navigable.
      */
      const row = document.createElement("label");
      row.className = "item-row";
      row.htmlFor   = "cb-" + item.id;

      // Hidden real checkbox (for semantics & state)
      const cb = document.createElement("input");
      cb.type          = "checkbox";
      cb.id            = "cb-" + item.id;
      cb.className     = "item-checkbox";
      cb.dataset.price = item.price;
      cb.dataset.layer = item.id;

      // Visual tick bubble
      const tick = document.createElement("span");
      tick.className = "item-tick";
      tick.setAttribute("aria-hidden", "true");

      // Label text
      const lbl = document.createElement("span");
      lbl.className = "item-label";
      lbl.textContent = item.label;

      // Price badge
      const price = document.createElement("span");
      price.className = "item-price";
      price.textContent = "+" + formatPrice(item.price);

      row.appendChild(cb);
      row.appendChild(tick);
      row.appendChild(lbl);
      row.appendChild(price);
      itemsDiv.appendChild(row);

      cb.addEventListener("change", () => onToggle(row, cb));
      allRows.push({ row, cb, item });
    });

    card.appendChild(itemsDiv);
    controlsPanel.appendChild(card);
  });

  /* ----------------------------------------------------------
     4. DESKTOP TOTAL CARD
  ---------------------------------------------------------- */
  const totalCardDesktop = document.createElement("div");
  totalCardDesktop.className = "total-card-desktop";
  totalCardDesktop.innerHTML = `
    <div class="total-label-inner">Estimated Total</div>
    <div class="total-amount-inner" id="totalAmountDesktop">${formatPrice(CONFIG.BASE_PRICE)}</div>
    <div class="total-breakdown-inner" id="totalBreakdownDesktop">No add-ons selected yet.</div>
  `;

  const resetBtn = document.createElement("button");
  resetBtn.className   = "btn-reset";
  resetBtn.textContent = "Clear all selections";
  resetBtn.addEventListener("click", resetAll);

  const disclaimer = document.createElement("p");
  disclaimer.className = "disclaimer";
  disclaimer.textContent =
    "This is an estimated price only. If you have specific requests for the reference sheet that are not listed here, please mention them in your message!";

  const credit = document.createElement("p");
  credit.className = "creator-credit";
  // ✏️ Replace "#" with the URL where people can download this widget
  credit.innerHTML = 'Calculator <a href="#" target="_blank" rel="noopener">widget</a> by Limie.Arts';

  controlsPanel.appendChild(totalCardDesktop);
  controlsPanel.appendChild(resetBtn);
  controlsPanel.appendChild(disclaimer);
  controlsPanel.appendChild(credit);

  // Init sticky bar display
  document.getElementById("stickyAmount").textContent = formatPrice(CONFIG.BASE_PRICE);

  /* ----------------------------------------------------------
     5. TOGGLE HANDLER
  ---------------------------------------------------------- */
  function onToggle(row, cb) {
    // Sync visual selected state on the card
    row.classList.toggle("selected", cb.checked);

    // Show/hide preview layer
    const layerEl = document.getElementById("layer-" + cb.dataset.layer);
    if (layerEl) layerEl.classList.toggle("visible", cb.checked);

    recalculate();
  }

  /* ----------------------------------------------------------
     6. RECALCULATE
  ---------------------------------------------------------- */
  function recalculate() {
    let total = CONFIG.BASE_PRICE;
    const breakdown = [];

    allRows.forEach(({ cb, item }) => {
      if (cb.checked) {
        total += parseInt(cb.dataset.price, 10);
        breakdown.push(item.label);
      }
    });

    // Layer count badge — only count items that have a visual overlay
    const activeCount = allRows.filter(r => r.cb.checked && r.item.img).length;
    layerCountEl.textContent = activeCount + (activeCount === 1 ? " layer" : " layers");
    layerCountEl.classList.toggle("show", activeCount > 0);

    const priceStr = formatPrice(total);

    // --- Desktop total card ---
    const amtD = document.getElementById("totalAmountDesktop");
    if (amtD) {
      amtD.textContent = priceStr;
      bump(amtD);
    }
    const brkD = document.getElementById("totalBreakdownDesktop");
    if (brkD) {
      const parts = CONFIG.BASE_PRICE > 0
        ? ["Base " + formatPrice(CONFIG.BASE_PRICE), ...breakdown]
        : breakdown;
      brkD.textContent = parts.length ? parts.join(" · ") : "No add-ons selected yet.";
    }

    // --- Sticky mobile bar ---
    const stickyAmt = document.getElementById("stickyAmount");
    stickyAmt.textContent = priceStr;
    bump(stickyAmt);

    const stickyBrk = document.getElementById("stickyBreakdown");
    if (breakdown.length) {
      stickyBrk.textContent = breakdown.join(" · ");
      stickyBrk.style.display = "block";
    } else {
      stickyBrk.style.display = "none";
    }
  }

  /* Tiny scale-bump animation on price change */
  function bump(el) {
    el.classList.remove("bump");
    void el.offsetWidth;  // force reflow
    el.classList.add("bump");
    setTimeout(() => el.classList.remove("bump"), 150);
  }

  /* ----------------------------------------------------------
     7. RESET
  ---------------------------------------------------------- */
  function resetAll() {
    allRows.forEach(({ row, cb }) => {
      cb.checked = false;
      row.classList.remove("selected");
      const layerEl = document.getElementById("layer-" + cb.dataset.layer);
      if (layerEl) layerEl.classList.remove("visible");
    });
    recalculate();
  }

})();
</script>
</body>
</html>
